# =============================================================================
# Secretos del contenedor de tracking, materializados desde AKV (vault `giorgio`).
#
# Convención del repo: `<namespace>-<service>-<clave>`.
#
#   analytics-matomo-collector-token  → token de la API de Matomo (matomo-token).
#                                        Hace falta para que Matomo acepte `cip` y
#                                        `cdt`: sin token, los eventos llegan con
#                                        la IP y la fecha del contenedor, no las
#                                        del usuario. Es UN token de la instancia
#                                        central (Matomo permite el mismo token
#                                        para varios sitios).
#   tracking-collector-sites-tokens    → JSON {slug: token} con el token de
#                                        ingreso de cada sitio. Es lo que
#                                        autentica al WordPress contra el
#                                        contenedor: el endpoint del contenedor
#                                        no es público, pero el REST del sitio sí
#                                        lo es, así que sin esto cualquiera
#                                        podría inyectar eventos.
#
# Cómo cargarlos (nunca por el chat, nunca al repo):
#   az keyvault secret set --vault-name giorgio \
#     --name analytics-matomo-collector-token --value "<token de Matomo>"
#   az keyvault secret set --vault-name giorgio \
#     --name tracking-collector-sites-tokens --value '{"urano":"<token>","familey":"<token>"}'
#
# `optional: true` en el Deployment es deliberado: sin estos secretos el
# contenedor arranca en modo degradado (sin cip/cdt y rechazando todo ingreso,
# porque REQUIRE_SITE_TOKEN=1) en vez de quedar en CrashLoopBackOff. Un pod que
# arranca y avisa es más fácil de diagnosticar que uno que no arranca.
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tracking-collector-secrets
  namespace: tracking
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-kv
  target:
    name: tracking-collector-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: matomo-token
      remoteRef:
        key: analytics-matomo-collector-token
    - secretKey: sites-tokens.json
      remoteRef:
        key: tracking-collector-sites-tokens
