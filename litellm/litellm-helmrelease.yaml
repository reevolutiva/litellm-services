---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm
  namespace: litellm
spec:
  interval: 10m
  chart:
    spec:
      chart: litellm-helm
      # Chart explícito: sin `version` Flux tomaba siempre la última publicada
      # (hoy 1.102.1) mientras la imagen va por v1.103.0-rc.1 — drift silencioso.
      version: ">=1.102.1"
      sourceRef:
        kind: HelmRepository
        name: litellm
        namespace: flux-system
      interval: 1h
  values:
    # `proxy_config` se renderiza tal cual como el config.yaml del proxy (el
    # chart lo deep-mergea sobre sus defaults, así que model_list y
    # general_settings.master_key se conservan).
    proxy_config:
      model_list:
        - model_name: bge-m3
          litellm_params:
            model: ollama/bge-m3
            api_base: http://ollama.ai-services.svc.cluster.local:11434
            # Dimensión 1024 fijada por ADR 0013 — Mem0/PGVector esperan este valor.
            # No cambiar sin reindexar los recuerdos existentes.
            dimensions: 1024

        # =====================================================================
        # Azure AI Foundry — `reevolutiva-ai.services.ai.azure.com`.
        #
        # Cada deployment ACTIVO como modelo INDEPENDIENTE: se pide por nombre y
        # el router de abajo puede fijar uno por tier. La key sale del Secret
        # `litellm-env` (AKV `litellm-env`, clave `AZURE_AI_API_KEY`) — nunca va
        # en el repo.
        #
        # VERIFICADO el 2026-10-09 contra el endpoint real con esa key: cada
        # modelo de esta lista respondió 200. Los deployments que existían en la
        # configuración vieja pero YA NO están en Azure (`kimi-k3`, `mimo-v2.5`,
        # `qwen3.8-max`, `minimax-m3`, `grok-4-1-fast-reasoning`,
        # `gpt-5.4-nano-2026-03-17`) NO se declaran: un alias que apunta a un
        # deployment inexistente falla en tiempo de request y ensucia los tiers
        # del router.
        # =====================================================================
        - model_name: azure_ai/kimi-k2.6
          litellm_params:
            model: azure_ai/kimi-k2.6
            api_base: https://reevolutiva-ai.services.ai.azure.com/
            api_key: os.environ/AZURE_AI_API_KEY
        - model_name: azure_ai/kimi-k2.7-code
          litellm_params:
            model: azure_ai/kimi-k2.7-code
            api_base: https://reevolutiva-ai.services.ai.azure.com/
            api_key: os.environ/AZURE_AI_API_KEY
        - model_name: azure_ai/gpt-5.4-nano
          litellm_params:
            model: azure_ai/gpt-5.4-nano
            api_base: https://reevolutiva-ai.services.ai.azure.com/
            api_key: os.environ/AZURE_AI_API_KEY
        - model_name: azure_ai/gpt-5.4-mini
          litellm_params:
            model: azure_ai/gpt-5.4-mini
            api_base: https://reevolutiva-ai.services.ai.azure.com/
            api_key: os.environ/AZURE_AI_API_KEY
        - model_name: azure_ai/gpt-5.5
          litellm_params:
            model: azure_ai/gpt-5.5
            api_base: https://reevolutiva-ai.services.ai.azure.com/
            api_key: os.environ/AZURE_AI_API_KEY
        - model_name: azure_ai/gpt-5.6-luna
          litellm_params:
            model: azure_ai/gpt-5.6-luna
            api_base: https://reevolutiva-ai.services.ai.azure.com/
            api_key: os.environ/AZURE_AI_API_KEY
        - model_name: azure_ai/gpt-5.6-terra-2
          litellm_params:
            model: azure_ai/gpt-5.6-terra-2
            api_base: https://reevolutiva-ai.services.ai.azure.com/
            api_key: os.environ/AZURE_AI_API_KEY
        - model_name: azure_ai/gpt-5-nano
          litellm_params:
            model: azure_ai/gpt-5-nano
            api_base: https://reevolutiva-ai.services.ai.azure.com/
            api_key: os.environ/AZURE_AI_API_KEY
        - model_name: azure_ai/gpt-5-mini
          litellm_params:
            model: azure_ai/gpt-5-mini
            api_base: https://reevolutiva-ai.services.ai.azure.com/
            api_key: os.environ/AZURE_AI_API_KEY
        - model_name: azure_ai/gpt-5.3-codex
          litellm_params:
            model: azure_ai/gpt-5.3-codex
            api_base: https://reevolutiva-ai.services.ai.azure.com/
            api_key: os.environ/AZURE_AI_API_KEY
        - model_name: azure_ai/gpt-5.1-codex-mini
          litellm_params:
            model: azure_ai/gpt-5.1-codex-mini
            api_base: https://reevolutiva-ai.services.ai.azure.com/
            api_key: os.environ/AZURE_AI_API_KEY
        - model_name: azure_ai/MAI-Thinking-1
          litellm_params:
            model: azure_ai/MAI-Thinking-1
            api_base: https://reevolutiva-ai.services.ai.azure.com/
            api_key: os.environ/AZURE_AI_API_KEY
        - model_name: azure_ai/Phi-4-reasoning
          litellm_params:
            model: azure_ai/Phi-4-reasoning
            api_base: https://reevolutiva-ai.services.ai.azure.com/
            api_key: os.environ/AZURE_AI_API_KEY
        - model_name: azure_ai/Phi-4-mini-instruct
          litellm_params:
            model: azure_ai/Phi-4-mini-instruct
            api_base: https://reevolutiva-ai.services.ai.azure.com/
            api_key: os.environ/AZURE_AI_API_KEY
        - model_name: azure_ai/Llama-3.3-70B-Instruct
          litellm_params:
            model: azure_ai/Llama-3.3-70B-Instruct
            api_base: https://reevolutiva-ai.services.ai.azure.com/
            api_key: os.environ/AZURE_AI_API_KEY
        - model_name: azure_ai/deepseek-v4-flash
          litellm_params:
            model: azure_ai/deepseek-v4-flash
            api_base: https://reevolutiva-ai.services.ai.azure.com/
            api_key: os.environ/AZURE_AI_API_KEY
        - model_name: azure_ai/deepseek-v4-pro
          litellm_params:
            model: azure_ai/deepseek-v4-pro
            api_base: https://reevolutiva-ai.services.ai.azure.com/
            api_key: os.environ/AZURE_AI_API_KEY
        - model_name: azure_ai/embed-v-4-0
          litellm_params:
            model: azure_ai/embed-v-4-0
            api_base: https://reevolutiva-ai.services.ai.azure.com/
            api_key: os.environ/AZURE_AI_API_KEY
        - model_name: azure_ai/text-embedding-3-small
          litellm_params:
            model: azure_ai/text-embedding-3-small
            api_base: https://reevolutiva-ai.services.ai.azure.com/
            api_key: os.environ/AZURE_AI_API_KEY

        # =====================================================================
        # `rc_azure_implementer` — el router que usa el equipo (Hermes lo tiene
        # como modelo por defecto). RECUPERADO del proxy de `frontdoor` el
        # 2026-10-09 vía su API administrativa (`/model/info` descifra lo que en
        # la DB está cifrado), no reconstruido a ojo.
        #
        # ES UN AUTO ROUTER (`auto_router/complexity_router`) y su clasificador
        # es **JEV** (TypeSafe System One Choice): clasifica el prompt en un tier
        # antes de despachar y elige modelo del pool de ese tier. La
        # `TYPESAFE_API_KEY` ya está en el Secret `litellm-env`, así que además
        # queda disponible el passthrough en `/typesafe/*`.
        #
        # DIFERENCIA contra el original, deliberada y por evidencia: los tiers
        # referenciaban `kimi-k3` y `minimax-m3`, que ya no existen en Azure
        # (404 medido). Se quitaron esos dos; el resto es idéntico.
        #
        # `adaptive: true` = Thompson-sampling dentro del tier con pesos
        # costo/calidad; `session_affinity: false` = no fija la sesión al primer
        # modelo (era `false` en el original, y así el prompt-cache no se cruza
        # entre turnos de distinto tier).
        # =====================================================================
        - model_name: rc_azure_implementer
          litellm_params:
            model: auto_router/complexity_router
            complexity_router_config:
              classifier_type: jev
              jev_classifier_config:
                model: jev-latest
                timeout_ms: 3000
                circuit_breaker_enabled: true
                circuit_breaker_cooldown_seconds: 30
              classifier_fallback: heuristic
              adaptive: true
              adaptive_weights:
                cost: 0.2
                quality: 0.8
              adaptive_eligible: all
              session_affinity: false
              tier_distance_penalty: 0.5
              match_threshold: 0.5
              embedding_model: ollama/bge-m3
              tier_labels:
                SIMPLE: basico
                MEDIUM: coder
                COMPLEX: complejo
                REASONING: razonamiento
              tiers:
                SIMPLE:
                  - azure_ai/gpt-5.4-nano
                  - azure_ai/gpt-5-mini
                  - azure_ai/deepseek-v4-flash
                MEDIUM:
                  - azure_ai/gpt-5.3-codex
                  - azure_ai/gpt-5.1-codex-mini
                  - azure_ai/kimi-k2.7-code
                COMPLEX:
                  - azure_ai/gpt-5.6-luna
                  - azure_ai/gpt-5.6-terra-2
                  - azure_ai/deepseek-v4-pro
                REASONING:
                  - azure_ai/gpt-5.6-terra-2
                  - azure_ai/deepseek-v4-pro
                  - azure_ai/MAI-Thinking-1
              keyword_tier_rules:
                - tier: REASONING
                  keywords: ["Diseña", "Delega", "orquesta", "Planifica", "Analiza", "Contrasta", "Compara", "Identifica", "Razona", "Argumenta", "contrarresta", "debate"]
                - tier: COMPLEX
                  keywords: ["Explora", "Recopila", "Inestiga", "Da seguimiento", "Supervisa", "compacta", "Auditoria"]
                - tier: MEDIUM
                  keywords: ["Implementa", "Test", "escribe", "redacta", "documenta", "Ejecútalo", "monitorea"]
              escalation_keywords:
                - LITELLM ESCALATE
                - LITELLM_SUPER
              custom_technical_keywords: ["Docker", "K3s", "Paperclip", "Litellm", "Hermes", "Cluster", "Deploy", "E2E", "Azure", "Azd", "az"]
              return_raw_model_name: false
      # `store_model_in_db: false` — la fuente de verdad de los modelos es ESTE
      # archivo (GitOps), no la base del proxy. Con el default (`true`) y la
      # tabla `LiteLLM_ProxyModelTable` vacía, `/v1/models` respondía **vacío**
      # a las virtual keys (medido el 2026-10-09): un cliente que descubre
      # modelos —Hermes con `discover_models`— no veía ninguno aunque los
      # completions funcionaran. La master key sí los veía porque no filtra por
      # la DB. Con esto, lo que sirve el proxy es exactamente lo que está en Git.
      general_settings:
        store_model_in_db: false

      litellm_settings:
        # Cache de RESPUESTAS LLM en el Redis del clúster (antes iba a memoria
        # del proceso: /cache/ping reportaba LiteLLMCacheType.LOCAL).
        #
        # La password va por REFERENCIA al entorno, no embebida: REDIS_PASSWORD
        # vive en el Secret `litellm-env`, que ESO materializa desde AKV. Así el
        # secreto sigue teniendo una sola fuente.
        cache: true
        cache_params:
          type: redis
          host: redis.databases.svc.cluster.local
          port: "6379"
          password: os.environ/REDIS_PASSWORD
          namespace: litellm
        # El cache de API keys (auth) venía quedando por-worker en memoria: el
        # propio proxy lo avisa en el log y pide esta clave. Con el Redis del
        # clúster compartido, la validación de claves deja de ir a memoria de
        # cada worker.
        enable_redis_auth_cache: true
      # F1.0 — Guardrail de compresión. En LiteLLM Community, los guardrails
      # built-in como `headroom` NO se registran por API (/guardrails/register
      # rechaza todo lo que no sea `generic_guardrail_api`) ni se cargan
      # automáticamente de la DB al arrancar. Se declaran en el config.yaml del
      # proxy, que este chart renderiza desde `proxy_config`.
      #
      # La fila en `LiteLLM_GuardrailsTable` (migrada de frontdoor) coexiste
      # pero el proxy Community la ignora al arrancar. `default_on: false`
      # para que solo compriman las virtual keys que tengan el guardrail
      # adjunto en su metadata.
      guardrails:
        - guardrail_name: headroom-compression
          litellm_params:
            guardrail: headroom
            mode: pre_call
            api_base: http://headroom:8787
            default_on: false
            fail_on_error: true
            unreachable_fallback: fail_closed
    image:
      repository: ghcr.io/berriai/litellm
      tag: v1.103.0-rc.1
    replicaCount: 1
    # LiteLLM debe co-localizarse con PostgreSQL y Redis: el RTT entre nodos
    # del clúster es alto y el nodo de desarrollo ya sufrió DiskPressure/SystemOOM.
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
        ephemeral-storage: 2Gi
      limits:
        cpu: "2"
        memory: 8Gi
        ephemeral-storage: 4Gi
    db:
      useExisting: true
      deployStandalone: false
      endpoint: postgresql.databases.svc.cluster.local
      port: 5432
      database: litellm
      secret:
        name: litellm-db
        usernameKey: username
        passwordKey: password
    masterkeySecretName: litellm-masterkey
    masterkeySecretKey: masterkey
    # NOTA: acá había un bloque `redis:` con host/port/passwordSecretName/
    # passwordSecretKey que NO son valores de este chart — su sección `redis:`
    # configura el subchart embebido, no una instancia externa. Helm ignora las
    # claves desconocidas en silencio, así que ese bloque no hacía nada y hacía
    # creer que el wiring existía.
    #
    # El mecanismo real (documentado por el propio chart, con `redis.enabled:
    # false`): el proxy toma REDIS_HOST / REDIS_PORT / REDIS_PASSWORD del entorno
    # para la coordinación. Esas claves viven en el Secret `litellm-env`, que
    # materializa ESO desde AKV — esa es la única fuente que hay que cambiar.
    #
    # OJO al migrar de host: LiteLLM persiste config en Postgres y **la config
    # de la DB gana sobre las variables de entorno**. Hay que revisar además
    # `LiteLLM_Config.general_settings.coordination_redis` y
    # `LiteLLM_CacheConfig.cache_settings`, o el proxy seguirá apuntando al
    # Redis viejo aunque el Secret esté correcto.
    environmentSecrets:
      - litellm-env
      # Banderas propias: el chart solo inyecta lo que sale de aca (ver el
      # encabezado de `flags-secret.yaml`).
      - litellm-flags
    livenessProbe:
      httpGet:
        path: /health/readiness
        port: 4000
      initialDelaySeconds: 30
    readinessProbe:
      httpGet:
        path: /health/readiness
        port: 4000
      initialDelaySeconds: 10
    env:
      - name: DISABLE_SCHEMA_UPDATE
        value: "true"
