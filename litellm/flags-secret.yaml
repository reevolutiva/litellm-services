# =============================================================================
# Banderas de entorno del proxy que NO son secretos pero tienen que llegar como
# variables de entorno.
#
# POR QUÉ UN SECRET Y NO `values.env` NI `general_settings`: el chart
# (`litellm-helm`) solo inyecta en el contenedor lo que sale de
# `environmentSecrets` — está medido: una entrada propia en `values.env` NO se
# renderiza en el pod (su `env` propio trae solo el default del chart,
# `DISABLE_SCHEMA_UPDATE`), y `general_settings.store_model_in_db` tampoco cambia
# la respuesta porque LiteLLM lee la bandera del entorno. Se declara como Secret
# porque es el mecanismo que el chart sí respeta (`envFrom`).
#
# QUÉ HACE `STORE_MODEL_IN_DB=false`: con el valor `true` que trae el Secret
# `litellm-env` y la tabla `LiteLLM_ProxyModelTable` vacía, `/v1/models`
# respondía **vacío** a las virtual keys aunque los completions funcionaran
# (medido 2026-10-09; la master key sí veía los 21). Con `false`, la fuente de
# los modelos es la config de Git — que es el diseño del directorio.
#
# NO TIENE SECRETOS: son banderas. Si algún día lleva una credencial, se mueve a
# AKV como todo lo demás (ver `infrastructure/external-secrets/`).
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: litellm-flags
  namespace: litellm
type: Opaque
stringData:
  STORE_MODEL_IN_DB: "false"
